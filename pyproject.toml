[project]
name = "jpzh-subtitle"
version = "0.1.0"
description = "离线日中字幕翻译工具：视频 → 日语ASR → 中文字幕"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "requests>=2.28.0",
]

[project.scripts]
jpzh-subtitle = "jpzh_subtitle.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jpzh_subtitle"]
